name: Build, test and analyze

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      # The scanner is built for an older .NET; let it run on the .NET 11 runtime of this job.
      - name: Begin analysis
        env:
          DOTNET_ROLL_FORWARD: Major
        run: >
          dotnet sonarscanner begin
          /k:"sara-giulia_campus-app" /o:"sara-giulia"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          /d:sonar.coverage.exclusions="**/Program.cs,ml/**,**/Migrations/**,load-tests/**,frontend/**"
          /d:sonar.cpd.exclusions="ml/**"

      - name: Build
        run: dotnet build --no-incremental

      - name: Test with coverage
        run: dotnet test --no-build --collect:"XPlat Code Coverage" --settings coverlet.runsettings
        
      - name: End analysis
        env:
          DOTNET_ROLL_FORWARD: Major
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image and wait until the container is healthy
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Check /health
        run: curl -fs http://localhost:5080/health

      - name: Container logs
        if: failure()
        run: docker compose logs

      - name: Stop and remove the container and the volume
        if: always()
        run: docker compose down -v

name: ML reproducibility and training

on:
  push:
    branches: [main]
    paths:
      - 'ml/**'
      - 'tests/CampusMarket.ML.Tests/**'
  pull_request:
    paths:
      - 'ml/**'
      - 'tests/CampusMarket.ML.Tests/**'

jobs:
  ml:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      # The model of the search by meaning is not in git; the evaluation in ML.Tests needs it.
      - name: Cache the search model
        uses: actions/cache@v4
        with:
          path: ml/models/semantic-search
          key: search-model-${{ hashFiles('ml/scripts/download-search-model.sh') }}

      - name: Download the search model (checked against its SHA-256)
        run: bash ml/scripts/download-search-model.sh

      - name: Restore
        run: dotnet restore CampusMarket.sln

      # Snapshot the committed metadata BEFORE training overwrites it; the
      # comparison step below reads the reference from here.
      - name: Snapshot committed model metadata
        run: |
          mkdir -p .ci/reference-models
          cp ml/models/*.json .ci/reference-models/

      # Reproducibility gate: regenerate the dataset with the same seed and
      # fail if the bytes of ml/data/listings.csv changed. If this step
      # reports a diff, either the generator is no longer deterministic or
      # the committed CSV is out of date.
      - name: Regenerate the dataset and fail if listings.csv changed
        run: |
          dotnet run --project ml/CampusMarket.ML.DatasetGenerator --configuration Release
          git diff --exit-code -- ml/data/listings.csv

      - name: Train the models
        run: dotnet run --project ml/CampusMarket.ML.Training --configuration Release

      # Compare the fresh testMetrics in ml/models/*.json against the ones
      # committed on this branch. The script hard-codes both directories
      # (.ci/reference-models and ml/models, resolved from its own location)
      # so there is no path it can be redirected at. Allowed drift (also
      # documented in the script header): R2, accuracies and F1 may fall by
      # at most 0.02 absolute; MAE may grow by at most 5% relative.
      # Everything else in testMetrics is informational.
      - name: Check that no metric regressed vs the committed models
        run: python3 ml/scripts/check_metrics.py

      - name: Run the ML quality tests against the freshly trained models
        run: dotnet test tests/CampusMarket.ML.Tests --configuration Release

      # Upload both the zipped models and their JSON sidecars so a run's
      # artifacts show exactly what the metric comparison just approved.
      - name: Upload the trained models and their metadata
        uses: actions/upload-artifact@v4
        with:
          name: ml-models
          path: |
            ml/models/*.zip
            ml/models/*.json
          if-no-files-found: error

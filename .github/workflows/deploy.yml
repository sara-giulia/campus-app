name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Default permissions for every job in this workflow: read-only. Each job
# widens them explicitly if it has to (see publish-image below).
permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/campus-app

jobs:
  # The deploy pipeline runs only after the tests pass. We re-run them here
  # (dependency-free of build.yml) so the Docker publish cannot race ahead of
  # a failing main.
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 11.0.x

      - name: Restore
        run: dotnet restore CampusMarket.sln

      - name: Build
        run: dotnet build CampusMarket.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test CampusMarket.sln --no-build --configuration Release

  publish-image:
    needs: test
    runs-on: ubuntu-latest
    # Only this job writes to the GHCR package, so packages:write stays here
    # rather than at the workflow level. contents:read is repeated so this
    # job's permissions don't drop the implicit baseline.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Two tags: `latest` for the Render pull, and the full commit SHA so we
      # can always point Render at an exact build when we need to roll back.
      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  trigger-render:
    needs: publish-image
    runs-on: ubuntu-latest
    steps:
      # The deploy hook is optional: when the repo has no RENDER_DEPLOY_HOOK
      # secret (no Render service wired up yet), we skip the call rather than
      # fail the workflow. The hook URL is secret because anyone who has it
      # can trigger a redeploy of the service.
      - name: Trigger Render redeploy if the hook is set
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not set; skipping Render redeploy."
            exit 0
          fi
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"

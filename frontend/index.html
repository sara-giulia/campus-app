<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CampusMarket: manuale, notițe și echipamente vândute între studenți, în campus." />
    <meta name="theme-color" content="#ffffff" />
    <title>CampusMarket</title>
    <script>
      // Apply the saved theme (or the system one) before the page paints. Same key as src/app/ui/theme.ts.
      try {
        var saved = localStorage.getItem('campusmarket.theme')
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

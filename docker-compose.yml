services:
  api:
    build: .
    ports:
      - "5080:8080"
    environment:
      # Local demo only: dev JWT key and the seeded admin
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CampusMarket: "Host=db;Port=5432;Database=campusmarket;Username=campusmarket;Password=campusmarket"
      # Point the API at the Mailpit container below. Mailpit's SMTP speaks
      # plain, so UseSsl is false. Credentials are left unset: Mailpit accepts
      # any sender; set Email__Username / Email__Password only for real SMTP.
      Email__Host: mailpit
      Email__Port: "1025"
      Email__UseSsl: "false"
      Email__From: noreply@campusmarket.local
    depends_on:
      # The API runs the migrations at startup, so it waits until PostgreSQL accepts connections.
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      # Uploaded photos (/app/data/photos) survive "docker compose down"; "down -v" removes them
      - campusmarket-data:/app/data

  # Local PostgreSQL (the same engine as on Render). "docker compose up -d db" starts only the
  # database, for "dotnet run" on the host (port 5433, so it does not clash with a PostgreSQL
  # installed on the machine). The data survives "docker compose down"; "down -v" removes it.
  # pgvector/pgvector:pg17 is PostgreSQL 17 with the pgvector extension (the vectors of the search by
  # meaning); an existing campusmarket-pg volume keeps working, it is the same PostgreSQL 17.
  db:
    image: pgvector/pgvector:pg17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: campusmarket
      POSTGRES_USER: campusmarket
      POSTGRES_PASSWORD: campusmarket
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusmarket -d campusmarket"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - campusmarket-pg:/var/lib/postgresql/data

  # Local-dev SMTP sink: accepts every email the API sends and shows it in a
  # web UI on http://localhost:8025. No credentials, no outbound traffic.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"  # web UI
      - "1025:1025"  # SMTP

volumes:
  campusmarket-data:
  campusmarket-pg:

services:
  api:
    build: .
    ports:
      - "5080:8080"
    environment:
      # Local demo only: dev JWT key and the seeded admin
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      # The SQLite database survives "docker compose down"; "down -v" removes it
      - campusmarket-data:/app/data

volumes:
  campusmarket-data:
